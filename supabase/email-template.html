<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>循序 · 邮箱验证码</title>
  </head>
  <body style="margin:0;background:#f3f2ec;color:#233e34;font-family:Arial,'Microsoft YaHei',sans-serif;line-height:1.7;">
    <div style="max-width:480px;margin:40px auto;padding:32px 28px;background:#ffffff;border-radius:18px;">
      <p style="margin:0 0 24px;font-size:14px;font-weight:700;letter-spacing:2px;">循序 · XUNXU</p>
      <h1 style="margin:0 0 16px;font-size:24px;line-height:1.4;">验证邮箱，保存你的训练档案</h1>
      <p style="margin:0 0 16px;">请回到循序训练计划页面，输入本次验证码：</p>
      <p style="margin:20px 0;padding:18px 12px;background:#edf3ec;border-radius:12px;text-align:center;font-size:32px;font-weight:700;letter-spacing:7px;">{{ .Token }}</p>
      <p style="margin:0 0 16px;">完成验证后，你可以保存自己的成绩截图、个人资料和训练打卡，并在其他设备继续查看。</p>
      <p style="margin:0 0 16px;">请尽快使用；如果验证码已过期，回到页面重新获取。请勿把验证码转发给他人。</p>
      <p style="margin:24px 0 0;color:#69776e;font-size:13px;">如果你没有发起这次登录，可以忽略这封邮件。</p>
    </div>
  </body>
</html>
